<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Hub Demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Skill Hub Demo</h1>
                <div class="header-controls">
                    <span>用户:</span>
                    <input type="text" id="user-id-input" value="demo-user" style="width:120px;padding:4px 8px;border-radius:4px;border:none;">
                    <button class="nav-btn" id="notification-bell" onclick="toggleNotifications()">
                        通知 <span id="unread-badge" class="badge badge-unread" style="display:none">0</span>
                    </button>
                    <div id="notification-dropdown" class="notification-dropdown" style="display:none"></div>
                </div>
            </div>
            <nav>
                <button class="nav-btn active" data-view="home">首页</button>
                <button class="nav-btn" data-view="skills">技能管理</button>
                <button class="nav-btn" data-view="admin">管理台</button>
            </nav>
        </header>

        <main>
            <div id="home-view" class="view active">
                <div class="welcome-section">
                    <h2>欢迎使用 Skill Hub</h2>
                    <p>技能管理系统</p>
                    <div class="stats">
                        <div class="stat-card"><h3 id="total-skills">0</h3><p>总技能数</p></div>
                        <div class="stat-card"><h3 id="published-skills">0</h3><p>已发布</p></div>
                        <div class="stat-card"><h3 id="pending-reviews">0</h3><p>待审批</p></div>
                    </div>
                </div>
            </div>

            <div id="skills-view" class="view">
                <div class="action-bar">
                    <h2>技能管理</h2>
                    <button class="btn btn-primary" id="create-skill-btn">创建技能</button>
                </div>
                <div class="search-bar">
                    <input type="text" id="skill-search" placeholder="搜索技能...">
                    <select id="skill-status-filter">
                        <option value="">全部状态</option>
                        <option value="DRAFT">草稿</option>
                        <option value="PENDING_REVIEW">审批中</option>
                        <option value="PUBLISHED">已发布</option>
                        <option value="REJECTED">未通过</option>
                        <option value="DELISTED">已下架</option>
                    </select>
                    <button class="btn btn-search" id="search-skill-btn">搜索</button>
                </div>
                <div class="skills-list" id="skills-list"></div>
            </div>

            <div id="admin-view" class="view">
                <div class="action-bar"><h2>管理台</h2></div>
                <div class="admin-tabs">
                    <button class="nav-btn active" onclick="switchAdminTab('reviews')">审批列表</button>
                    <button class="nav-btn" onclick="switchAdminTab('skills')">技能下架/恢复</button>
                </div>
                <div id="admin-reviews-panel" class="admin-panel active">
                    <div class="search-bar">
                        <select id="review-status-filter">
                            <option value="">全部</option>
                            <option value="PENDING">待审批</option>
                            <option value="APPROVED">已通过</option>
                            <option value="REJECTED">已拒绝</option>
                        </select>
                        <button class="btn btn-search" onclick="loadReviews()">刷新</button>
                    </div>
                    <div id="reviews-list"></div>
                </div>
                <div id="admin-skills-panel" class="admin-panel">
                    <div id="admin-skills-list"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="notify-toast" style="display:none;position:fixed;top:20px;right:20px;z-index:10000;min-width:300px"></div>

    <script src="js/app.js"></script>
</body>
</html>
