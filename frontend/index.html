<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Hub Demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Skill Hub Demo</h1>
            <nav>
                <button class="nav-btn active" data-view="home">首页</button>
                <button class="nav-btn" data-view="skills">技能管理</button>
                <button class="nav-btn" data-view="categories">分类管理</button>
            </nav>
        </header>

        <main>
            <!-- 首页视图 -->
            <div id="home-view" class="view active">
                <div class="welcome-section">
                    <h2>欢迎使用 Skill Hub</h2>
                    <p>一个简单的技能管理系统演示</p>
                    <div class="stats">
                        <div class="stat-card">
                            <h3 id="total-skills">0</h3>
                            <p>总技能数</p>
                        </div>
                        <div class="stat-card">
                            <h3 id="published-skills">0</h3>
                            <p>已发布</p>
                        </div>
                        <div class="stat-card">
                            <h3 id="total-categories">0</h3>
                            <p>分类数量</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 技能管理视图 -->
            <div id="skills-view" class="view">
                <div class="action-bar">
                    <h2>技能管理</h2>
                    <button class="btn btn-primary" id="create-skill-btn">创建技能</button>
                </div>

                <div class="search-bar">
                    <input type="text" id="skill-search" placeholder="搜索技能...">
                    <select id="skill-status-filter">
                        <option value="">全部状态</option>
                        <option value="DRAFT">草稿</option>
                        <option value="PUBLISHED">已发布</option>
                        <option value="ARCHIVED">已归档</option>
                    </select>
                    <select id="skill-category-filter">
                        <option value="">全部分类</option>
                    </select>
                    <button class="btn btn-search" id="search-skill-btn">搜索</button>
                </div>

                <div class="skills-list" id="skills-list">
                    <!-- 技能列表将在这里动态生成 -->
                </div>
            </div>

            <!-- 分类管理视图 -->
            <div id="categories-view" class="view">
                <div class="action-bar">
                    <h2>分类管理</h2>
                    <button class="btn btn-primary" id="create-category-btn">创建分类</button>
                </div>

                <div class="categories-list" id="categories-list">
                    <!-- 分类列表将在这里动态生成 -->
                </div>
            </div>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
