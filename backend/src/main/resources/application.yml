server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: skill-hub-demo

  datasource:
    url: jdbc:h2:mem:skillhub;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      schema-locations: classpath:schema/schema.sql
      mode: always

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  h2:
    console:
      enabled: true
      path: /h2-console

# MyBatis 配置
mybatis:
  mapper-locations: classpath:dao/maps/*.xml
  type-aliases-package: com.skillhub.domain
  configuration:
    map-underscore-to-camel-case: true

# 本地文件存储配置
storage:
  base-path: ../storage
  skills-path: skills
  icons-path: icons
  packages-path: packages
  manifests-path: manifests

# 日志配置
logging:
  level:
    com.skillhub: debug

# 可见性开关
skill:
  visibility:
    enabled: false

# QwenPaw 测试配置（预留）
qwenpaw:
  api-base-url: http://localhost:8088