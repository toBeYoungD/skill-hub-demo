server:
  port: 8080

spring:
  application:
    name: skill-hub-demo

  datasource:
    url: jdbc:h2:mem:skillhub;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# 本地文件存储配置
storage:
  base-path: ../storage
  skills-path: skills
  icons-path: icons
  packages-path: packages
  manifests-path: manifests

# 日志配置
logging:
  level:
    com.skillhub: debug
    org.hibernate.SQL: debug

# 可见性开关
skill:
  visibility:
    enabled: false

# QwenPaw 测试配置（预留）
qwenpaw:
  api-base-url: http://localhost:8088